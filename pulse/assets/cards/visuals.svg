<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="card-visuals-t card-visuals-d">
<title id="card-visuals-t">A card on every alert — Pulse</title><desc id="card-visuals-d">Each alert gets a Grok Imagine image built from its headline, severity and symbols; high alerts can add a 6-second video brief. 16:9 image on every alert; --video adds a 6 s brief on high; A budget stop still sends the text; The card rides along in Telegram.</desc>
<style>.r{animation:rise 900ms cubic-bezier(.2,.8,.2,1) both}.r2{animation-delay:120ms}.r3{animation-delay:240ms}.r4{animation-delay:360ms}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.lp{animation:lp 9000ms linear infinite}@keyframes lp{0%,92%{opacity:1}97%,100%{opacity:0}}.s0{animation:s0 9000ms linear infinite}@keyframes s0{0%,10.00%{opacity:0;transform:translateX(-6px)}12.00%,100%{opacity:1;transform:none}}.k0{animation:k0 9000ms linear infinite}@keyframes k0{0%,17.00%{opacity:0}18.00%,100%{opacity:1}}.s1{animation:s1 9000ms linear infinite}@keyframes s1{0%,27.00%{opacity:0;transform:translateX(-6px)}29.00%,100%{opacity:1;transform:none}}.k1{animation:k1 9000ms linear infinite}@keyframes k1{0%,34.00%{opacity:0}35.00%,100%{opacity:1}}.s2{animation:s2 9000ms linear infinite}@keyframes s2{0%,44.00%{opacity:0;transform:translateX(-6px)}46.00%,100%{opacity:1;transform:none}}.k2{animation:k2 9000ms linear infinite}@keyframes k2{0%,51.00%{opacity:0}52.00%,100%{opacity:1}}.s3{animation:s3 9000ms linear infinite}@keyframes s3{0%,61.00%{opacity:0;transform:translateX(-6px)}63.00%,100%{opacity:1;transform:none}}.k3{animation:k3 9000ms linear infinite}@keyframes k3{0%,68.00%{opacity:0}69.00%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="card-visuals-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f4a"/><stop offset="1" stop-color="#ffb43d"/></linearGradient></defs>
<rect width="600" height="340" rx="10" fill="#08080b"/>
<rect x=".5" y=".5" width="599" height="339" rx="10" fill="none" stroke="#332b33"/>
