<rect class="r r2" x="28" y="90" width="40" height="3" fill="url(#card-visuals-g)"/>
<g class="r r3"><text x="28" y="116" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px">Each alert gets a Grok Imagine image built from its headline, severity and</text><text x="28" y="135" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px">symbols; high alerts can add a 6-second video brief.</text></g>
