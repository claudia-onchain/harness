<rect x="46" y="92" width="196" height="120" rx="8" fill="#111015" stroke="#332b33"/><rect class="h0" x="46" y="92" width="196" height="120" rx="8" fill="none" stroke="#ffb43d" stroke-width="1.5"/><text x="64" y="122" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">01</text><text x="64" y="150" fill="#f2ecee" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">WINDOW</text><text x="64" y="176" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">last run's day →</text><text x="64" y="194" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">tomorrow, UTC</text><path class="e" d="M244 152 L270 152" fill="none" stroke="#ff5f4a" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="272" y="92" width="196" height="120" rx="8" fill="#111015" stroke="#332b33"/><rect class="h1" x="272" y="92" width="196" height="120" rx="8" fill="none" stroke="#ffb43d" stroke-width="1.5"/><text x="290" y="122" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">02</text><text x="290" y="150" fill="#f2ecee" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">SCAN</text><text x="290" y="176" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">grok-4.3 + x_search,</text><text x="290" y="194" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">cited posts only</text><path class="e" d="M470 152 L496 152" fill="none" stroke="#ff5f4a" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="498" y="92" width="196" height="120" rx="8" fill="#111015" stroke="#332b33"/><rect class="h2" x="498" y="92" width="196" height="120" rx="8" fill="none" stroke="#ffb43d" stroke-width="1.5"/><text x="516" y="122" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">03</text><text x="516" y="150" fill="#f2ecee" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">JUDGE</text><text x="516" y="176" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">grok-4.7, no tools:</text><text x="516" y="194" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">alert or not</text><path class="e" d="M696 152 L722 152" fill="none" stroke="#ff5f4a" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="724" y="92" width="196" height="120" rx="8" fill="#111015" stroke="#332b33"/><rect class="h3" x="724" y="92" width="196" height="120" rx="8" fill="none" stroke="#ffb43d" stroke-width="1.5"/><text x="742" y="122" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">04</text><text x="742" y="150" fill="#f2ecee" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">CARD</text><text x="742" y="176" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">Grok Imagine image,</text><text x="742" y="194" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">video on high</text><path class="e" d="M922 152 L948 152" fill="none" stroke="#ff5f4a" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="950" y="92" width="196" height="120" rx="8" fill="#111015" stroke="#332b33"/><rect class="h4" x="950" y="92" width="196" height="120" rx="8" fill="none" stroke="#ffb43d" stroke-width="1.5"/><text x="968" y="122" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">05</text><text x="968" y="150" fill="#f2ecee" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">SEND</text><text x="968" y="176" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">Telegram + stored</text><text x="968" y="194" fill="#c4bcc0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">for pulse why</text>
<text x="46" y="250" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:11px">The budget is checked after every response. A run that crosses its cap stops there, and still delivers what it has.</text>
