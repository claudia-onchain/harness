<g class="lp"><g class="p0"><text x="24" y="76" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">$ </text><text x="44" y="76" fill="#f2ecee" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">git clone https://github.com/claudia-onchain/harness.git &amp;&amp; cd harness/pulse</text><rect class="cv c0" x="44" y="61" width="604.8" height="21" fill="#08080b"/></g><g class="p1"><text x="24" y="104" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">$ </text><text x="44" y="104" fill="#f2ecee" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">npm link &amp;&amp; pulse init</text><rect class="cv c1" x="44" y="89" width="183.6" height="21" fill="#08080b"/></g><g class="p2"><text x="24" y="132" fill="#ffb43d" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">✓ </text><text x="44" y="132" fill="#ffb43d" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">~/.pulse ready · xai key tested live</text><rect class="cv c2" x="44" y="117" width="292.8" height="21" fill="#08080b"/></g><g class="p3"><text x="24" y="160" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">$ </text><text x="44" y="160" fill="#f2ecee" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">pulse keys set telegram 123456:ABC…</text><rect class="cv c3" x="44" y="145" width="285" height="21" fill="#08080b"/></g><g class="p4"><text x="24" y="188" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">$ </text><text x="44" y="188" fill="#f2ecee" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">pulse watch add &quot;Solana&quot; --symbols SOL --keywords solana --every 15m --cap 0.40</text><rect class="cv c4" x="44" y="173" width="628.1999999999999" height="21" fill="#08080b"/></g><g class="p5"><text x="24" y="216" fill="#998f96" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">$ </text><text x="44" y="216" fill="#f2ecee" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:13px;white-space:pre">pulse run</text><rect class="cv c5" x="44" y="201" width="82.2" height="21" fill="#08080b"/></g></g>
