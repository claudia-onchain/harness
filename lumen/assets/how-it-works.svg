<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="flow-t flow-d">
<title id="flow-t">How a turn works</title><desc id="flow-d">You ask; the model plans with your key; tools run; the money gates check simulation, caps and approval; you decide.</desc>
<style>.e{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}.h0{opacity:0;animation:h0 7500ms linear infinite}@keyframes h0{0%,0.00%{opacity:0}2.00%,20.00%{opacity:1}22.00%,100%{opacity:0}}.h1{opacity:0;animation:h1 7500ms linear infinite}@keyframes h1{0%,20.00%{opacity:0}22.00%,40.00%{opacity:1}42.00%,100%{opacity:0}}.h2{opacity:0;animation:h2 7500ms linear infinite}@keyframes h2{0%,40.00%{opacity:0}42.00%,60.00%{opacity:1}62.00%,100%{opacity:0}}.h3{opacity:0;animation:h3 7500ms linear infinite}@keyframes h3{0%,60.00%{opacity:0}62.00%,80.00%{opacity:1}82.00%,100%{opacity:0}}.h4{opacity:0;animation:h4 7500ms linear infinite}@keyframes h4{0%,80.00%{opacity:0}82.00%,100.00%{opacity:1}100.00%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="flow-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect width="1200" height="270" rx="10" fill="#07080c"/>
<rect x=".5" y=".5" width="1199" height="269" rx="10" fill="none" stroke="#2a3045"/>
<text x="46" y="44" fill="#8a93a6" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:11px;letter-spacing:.14em">LUMEN</text><text x="46" y="72" fill="#e8ecf4" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:26px">HOW A TURN WORKS</text>
<rect x="46" y="92" width="196" height="120" rx="8" fill="#0e1016" stroke="#2a3045"/><rect class="h0" x="46" y="92" width="196" height="120" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5"/><text x="64" y="122" fill="#8a93a6" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">01</text><text x="64" y="150" fill="#e8ecf4" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">YOU ASK</text><text x="64" y="176" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">“swap 0.1 ETH to</text><text x="64" y="194" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">USDC on base”</text><path class="e" d="M244 152 L270 152" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="272" y="92" width="196" height="120" rx="8" fill="#0e1016" stroke="#2a3045"/><rect class="h1" x="272" y="92" width="196" height="120" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5"/><text x="290" y="122" fill="#8a93a6" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">02</text><text x="290" y="150" fill="#e8ecf4" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">MODEL PLANS</text><text x="290" y="176" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">your provider, your</text><text x="290" y="194" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">key, your persona</text><path class="e" d="M470 152 L496 152" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="498" y="92" width="196" height="120" rx="8" fill="#0e1016" stroke="#2a3045"/><rect class="h2" x="498" y="92" width="196" height="120" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5"/><text x="516" y="122" fill="#8a93a6" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">03</text><text x="516" y="150" fill="#e8ecf4" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">TOOLS RUN</text><text x="516" y="176" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">chains · media · files</text><text x="516" y="194" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">shell · screen · skills</text><path class="e" d="M696 152 L722 152" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="724" y="92" width="196" height="120" rx="8" fill="#0e1016" stroke="#2a3045"/><rect class="h3" x="724" y="92" width="196" height="120" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5"/><text x="742" y="122" fill="#8a93a6" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">04</text><text x="742" y="150" fill="#e8ecf4" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">GATES CHECK</text><text x="742" y="176" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">simulation, USD caps,</text><text x="742" y="194" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">approval prompt</text><path class="e" d="M922 152 L948 152" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="950" y="92" width="196" height="120" rx="8" fill="#0e1016" stroke="#2a3045"/><rect class="h4" x="950" y="92" width="196" height="120" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5"/><text x="968" y="122" fill="#8a93a6" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">05</text><text x="968" y="150" fill="#e8ecf4" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">YOU DECIDE</text><text x="968" y="176" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">type “send”, or not;</text><text x="968" y="194" fill="#b7bdcc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">answer streams back</text>
<text x="46" y="250" fill="#8a93a6" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:11px">Reads never ask. File writes and shell ask unless you say --yes. Anything that moves money asks every time, and the agent can't answer for you.</text>
</svg>
