<title id="card-skills-t">101 skills, 900 more per chain — Lumen</title><desc id="card-skills-d">Only names and descriptions sit in the prompt; the agent loads a skill when a task matches. Your own skills from ~/.claude/skills and ~/.agents/skills are picked up too. 20 chain templates rendered for every mainnet; /skill:&lt;slug&gt; runs one directly; skills/README.md documents the format; lumen skills export &lt;dir&gt; for other agents.</desc>
