<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="card-models-t card-models-d">
<title id="card-models-t">Any model, your keys — Lumen</title><desc id="card-models-d">Anthropic, OpenAI, xAI (Grok), OpenRouter, Gemini, Ollama, LM Studio or any OpenAI-compatible endpoint. Keys stay in ~/.lumen, mode 0600, optionally encrypted. lumen keys set anthropic sk-ant-…; Tested live before it's saved; Ctrl+P cycles models mid-chat; mock:echo runs with no key at all.</desc>
