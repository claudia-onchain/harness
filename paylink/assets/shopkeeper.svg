<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="sk-t sk-d">
<title id="sk-t">Paylink, the AI shopkeeper</title><desc id="sk-d">In the dashboard, Paylink makes a $45 payment link, answers a sales question from a lookup, and points a refund request to the Payments page instead of doing it.</desc>
<style>.lp{animation:lp 16000ms linear infinite}@keyframes lp{0%,95%{opacity:1}98.5%,100%{opacity:0}}.lk{stroke-dasharray:100;animation:lk 2400ms cubic-bezier(.4,0,.2,1) infinite}@keyframes lk{0%{stroke-dashoffset:100}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}.dot{animation:dot 1600ms ease-in-out infinite}@keyframes dot{0%,100%{opacity:.35}50%{opacity:1}}.m1{animation:m1 16000ms cubic-bezier(.2,.8,.2,1) infinite}@keyframes m1{0%,3.00%{opacity:0;transform:translateY(8px)}5.50%,100%{opacity:1;transform:none}}.m2{animation:m2 16000ms cubic-bezier(.2,.8,.2,1) infinite}@keyframes m2{0%,10.00%{opacity:0;transform:translateY(8px)}12.50%,100%{opacity:1;transform:none}}.m3{animation:m3 16000ms cubic-bezier(.2,.8,.2,1) infinite}@keyframes m3{0%,15.00%{opacity:0;transform:translateY(8px)}17.50%,100%{opacity:1;transform:none}}.m4{animation:m4 16000ms cubic-bezier(.2,.8,.2,1) infinite}@keyframes m4{0%,34.00%{opacity:0;transform:translateY(8px)}36.50%,100%{opacity:1;transform:none}}.m5{animation:m5 16000ms cubic-bezier(.2,.8,.2,1) infinite}@keyframes m5{0%,41.00%{opacity:0;transform:translateY(8px)}43.50%,100%{opacity:1;transform:none}}.m6{animation:m6 16000ms cubic-bezier(.2,.8,.2,1) infinite}@keyframes m6{0%,46.00%{opacity:0;transform:translateY(8px)}48.50%,100%{opacity:1;transform:none}}.m7{animation:m7 16000ms cubic-bezier(.2,.8,.2,1) infinite}@keyframes m7{0%,64.00%{opacity:0;transform:translateY(8px)}66.50%,100%{opacity:1;transform:none}}.m8{animation:m8 16000ms cubic-bezier(.2,.8,.2,1) infinite}@keyframes m8{0%,71.00%{opacity:0;transform:translateY(8px)}73.50%,100%{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="sk-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#5eead4"/></linearGradient></defs>
<rect width="820" height="470" rx="10" fill="#07090a"/>
<rect x=".5" y=".5" width="819" height="469" rx="10" fill="none" stroke="#283632"/>
<rect x="1" y="1" width="818" height="54" rx="9" fill="#0e1312"/><rect y="55" width="820" height="1" fill="#1a2422"/>
<g transform="translate(16 9) scale(0.59375)"><rect width="64" height="64" rx="16" fill="#0e1312" stroke="#1a2422"/><path d="M30 22h-6a10 10 0 0 0 0 20h6M34 42h6a10 10 0 0 0 0-20h-6M25 32h14" fill="none" stroke="#1a2422" stroke-width="5" stroke-linecap="round"/><path class="lk" d="M30 22h-6a10 10 0 0 0 0 20h6M34 42h6a10 10 0 0 0 0-20h-6M25 32h14" pathLength="100" fill="none" stroke="url(#sk-g)" stroke-width="5" stroke-linecap="round"/><circle class="dot" cx="48" cy="14" r="4.5" fill="#5eead4"/></g>
<text x="66" y="27" fill="#ebf3f0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700">Paylink</text><text x="66" y="45" fill="#8a9a95" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px">your AI shopkeeper · acts as you, with your role</text>
<text x="798" y="34" text-anchor="end" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10px;letter-spacing:.14em">TEST MODE · SAMPLE</text>
<g class="lp"><g class="m1"><rect x="498" y="76" width="298" height="34" rx="12" fill="#14302a"/><text x="514" y="98" fill="#ebf3f0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px">make a $45 link for the bunny plush</text></g>
<g class="m2"><text x="40" y="134" fill="#5eead4" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px">▸ create_payment_link</text><text x="201.29999999999998" y="134" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px">45.00 USD</text></g>
<g class="m3"><rect x="24" y="146" width="520" height="37" rx="12" fill="#0e1312" stroke="#1a2422"/><text x="40" y="169" fill="#ebf3f0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px">Done! It's on the counter: <tspan fill="#5eead4" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12.5px">paylink.useclaudia.xyz/l/…</tspan></text></g>
<g class="m4"><rect x="536" y="202" width="260" height="34" rx="12" fill="#14302a"/><text x="552" y="224" fill="#ebf3f0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px">how are sales going this week?</text></g>
<g class="m5"><text x="40" y="260" fill="#5eead4" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px">▸ get_analytics</text><text x="157.5" y="260" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px">days: 7</text></g>
<g class="m6"><rect x="24" y="272" width="520" height="56" rx="12" fill="#0e1312" stroke="#1a2422"/><text x="40" y="295" fill="#ebf3f0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px">38 payments, $1,284 this week. USDC on Solana is your top asset,</text><text x="40" y="314" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px">and one payment is waiting in Needs attention.</text></g>
<g class="m7"><rect x="634.8" y="348" width="161.2" height="34" rx="12" fill="#14302a"/><text x="650.8" y="370" fill="#ebf3f0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px">refund order 1042</text></g>
<g class="m8"><rect x="24" y="392" width="520" height="37" rx="12" fill="#0e1312" stroke="#1a2422"/><text x="40" y="415" fill="#ebf3f0" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px">I can't do refunds. Open <tspan fill="#5eead4">Payments → order 1042</tspan> and refund it there.</text></g></g>
</svg>
