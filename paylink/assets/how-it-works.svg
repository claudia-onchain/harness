<rect x="46" y="92" width="196" height="120" rx="8" fill="#0e1312" stroke="#283632"/><rect class="h0" x="46" y="92" width="196" height="120" rx="8" fill="none" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="122" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">01</text><text x="64" y="150" fill="#ebf3f0" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">QUOTE</text><text x="64" y="176" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">coin + network,</text><text x="64" y="194" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">one-time address</text><path class="e" d="M244 152 L270 152" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="272" y="92" width="196" height="120" rx="8" fill="#0e1312" stroke="#283632"/><rect class="h1" x="272" y="92" width="196" height="120" rx="8" fill="none" stroke="#5eead4" stroke-width="1.5"/><text x="290" y="122" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">02</text><text x="290" y="150" fill="#ebf3f0" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">SEEN</text><text x="290" y="176" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">processing: on chain,</text><text x="290" y="194" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">not final yet</text><path class="e" d="M470 152 L496 152" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="498" y="92" width="196" height="120" rx="8" fill="#0e1312" stroke="#283632"/><rect class="h2" x="498" y="92" width="196" height="120" rx="8" fill="none" stroke="#5eead4" stroke-width="1.5"/><text x="516" y="122" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">03</text><text x="516" y="150" fill="#ebf3f0" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">FINAL</text><text x="516" y="176" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">succeeded: booked</text><text x="516" y="194" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">to your ledger</text><path class="e" d="M696 152 L722 152" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="724" y="92" width="196" height="120" rx="8" fill="#0e1312" stroke="#283632"/><rect class="h3" x="724" y="92" width="196" height="120" rx="8" fill="none" stroke="#5eead4" stroke-width="1.5"/><text x="742" y="122" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">04</text><text x="742" y="150" fill="#ebf3f0" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">WEBHOOK</text><text x="742" y="176" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">signed event to</text><text x="742" y="194" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">your server</text><path class="e" d="M922 152 L948 152" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="950" y="92" width="196" height="120" rx="8" fill="#0e1312" stroke="#283632"/><rect class="h4" x="950" y="92" width="196" height="120" rx="8" fill="none" stroke="#5eead4" stroke-width="1.5"/><text x="968" y="122" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">05</text><text x="968" y="150" fill="#ebf3f0" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">SETTLE</text><text x="968" y="176" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">your balance, or</text><text x="968" y="194" fill="#b8c6c1" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">your own wallet</text>
<text x="46" y="250" fill="#8a9a95" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:11px">Late, short, doubled or on the wrong network? It opens a review under Needs attention. Ship the order on succeeded.</text>
