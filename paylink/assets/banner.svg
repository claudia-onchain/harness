<g class="r r2"><text x="296" y="164" fill="#ebf3f0" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:64px">PAYLINK</text></g>
