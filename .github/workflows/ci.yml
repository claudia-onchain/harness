name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lumen:
    name: Lumen · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lumen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            lumen/package-lock.json
            lumen/dashboard/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build dashboard
        run: npm run build
      - name: Check (syntax, skills, dashboard typecheck)
        run: npm run check
      - name: Test
        run: npm test
        env:
          CI: "1"
      - name: Smoke the CLI
        run: |
          node bin/lumen.js --version
          node bin/lumen.js doctor --offline --no-color || true
          node bin/lumen.js chains --no-color | head -5
          echo "say hi" | node bin/lumen.js --model mock:echo --no-color | head -5
